<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe7da">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="ikon-192.png">
<title>Ajan Ofisi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ff7a59%22/%3E%3Crect x=%229%22 y=%2211%22 width=%2214%22 height=%2210%22 rx=%223%22 fill=%22%23fff7f2%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modeller.css">
<style>
:root{
  --krem:#efe7da; --murekkep:#3b342c; --soluk:#6f665a; --mercan:#ff7a59; --mercan-k:#c2482a; --mercan-kk:#a83d22;
  --cam:rgba(255,250,243,.72); --cam-kenar:rgba(255,255,255,.8); --sag:384px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--krem);color:var(--murekkep);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#sahne{position:fixed;inset:0;display:block}
.vinyet{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 42% 58%,transparent 58%,rgba(120,96,70,.14) 100%)}
.cam{background:var(--cam);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);border:1px solid var(--cam-kenar);box-shadow:0 10px 40px rgba(90,70,50,.12),0 1px 0 rgba(255,255,255,.6) inset;border-radius:18px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h3.kucuk{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--soluk)}

/* ortak: odak, hareket azaltma, araç menüsü */
:focus-visible{outline:2px solid var(--mercan-k);outline-offset:2px}
.komut:focus-within{box-shadow:0 0 0 2px rgba(194,72,42,.35),0 10px 40px rgba(90,70,50,.12)}
.komut input:focus-visible,.komut textarea:focus-visible{outline:none}
.sayfa,.panel,.sag .kutu{backdrop-filter:none;-webkit-backdrop-filter:none}
.sag .kutu{background:rgba(255,250,243,.97)}
.araclar{position:relative;display:flex}
.araclar .ok{display:inline-block;width:6px;height:6px;margin-left:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.arac-menu{position:fixed;top:56px;min-width:190px;padding:6px;display:flex;flex-direction:column;gap:2px;background:#fffaf3;border:1px solid rgba(59,52,44,.12);border-radius:12px;box-shadow:0 10px 30px rgba(90,70,50,.18);z-index:7}
.arac-menu[hidden]{display:none}
.arac-menu button{text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500;color:#6d6357;min-height:40px}
.arac-menu button:hover{background:rgba(59,52,44,.06);color:var(--murekkep)}
.arac-menu button.secili{color:var(--murekkep);font-weight:600;background:rgba(59,52,44,.07)}
.bos-durum{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:13.5px;color:#4d453c}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* üst bar */
.ustbar{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:28px;padding:0 20px;background:rgba(250,245,237,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(59,52,44,.08);z-index:5}
.marka{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--mercan);display:grid;place-items:center;box-shadow:0 4px 14px rgba(255,122,89,.4)}
.logo i{width:13px;height:9px;border-radius:3px;background:#fff7f2;position:relative}
.logo i::before,.logo i::after{content:"";position:absolute;top:3px;width:3px;height:3px;border-radius:1px;background:var(--mercan)}
.logo i::before{left:3px}.logo i::after{right:3px}
.marka b{font-family:"Space Grotesk",sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em}
.marka small{font-size:11px;color:var(--soluk);font-weight:600;letter-spacing:.06em;margin-left:2px}
.sekmeler{display:flex;gap:4px;height:100%}
.sekmeler button{position:relative;padding:0 12px;font-size:14px;font-weight:500;color:#6d6357;white-space:nowrap}
.sekmeler button:hover{color:var(--murekkep)}
.sekmeler button.secili{color:var(--murekkep);font-weight:600}
.sekmeler button.secili::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--murekkep)}
.ustbar .bosluk{flex:1}
.hap{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.08)}
.hap b{font-family:"Space Grotesk",sans-serif;font-weight:600}
.nokta{width:8px;height:8px;border-radius:50%;background:#b9ad9e;flex:none}
.nokta.canli{background:var(--mercan);box-shadow:0 0 0 4px rgba(255,122,89,.18);animation:atis 1.4s ease-in-out infinite}
@keyframes atis{50%{opacity:.45}}
.saat{font-size:13px;color:var(--soluk);font-variant-numeric:tabular-nums}
.dugme{padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.08);transition:background .15s,transform .15s}
.dugme:hover{background:#fff}.dugme:active{transform:scale(.97)}

/* selamlama */
.selam{position:fixed;top:78px;left:22px;width:330px;padding:18px 20px;z-index:3}
.selam .tarih{font-size:12px;color:var(--soluk);font-weight:500}
.selam h1{font-family:"Space Grotesk",sans-serif;font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 8px}
.selam p{font-size:14px;line-height:1.5;color:#4d453c}
.selam p b{color:var(--murekkep)}
.selam .ozetdugme{margin-top:12px;background:var(--murekkep);color:#fff7ee;font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px}
.selam .ozetdugme:hover{background:#2a241e}

/* sağ kolon */
.sag{position:fixed;top:76px;right:16px;bottom:42px;width:var(--sag);display:flex;flex-direction:column;gap:12px;z-index:3}
.kutu{padding:16px 16px 12px;display:flex;flex-direction:column;min-height:0}
.kutu .bas{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.kutu .bas h2{font-family:"Space Grotesk",sans-serif;font-size:16px;font-weight:600}
.kutu .bas small{display:block;font-size:12px;color:var(--soluk);margin-top:1px}
.koyu{background:var(--murekkep);color:#fff7ee;font-size:12px;font-weight:600;padding:7px 11px;border-radius:9px;white-space:nowrap}
.koyu:hover{background:#2a241e}
.ceo-kutu{flex:0 1 auto;max-height:52%}
.kartlar{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.kart{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:10px 12px}
.kart.yeni{animation:gir .35s ease}
.kart .ust{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--soluk);font-weight:500}
.avatar{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.avatar.foto{width:26px;height:26px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(59,52,44,.22)}
.avatar.foto.orta{width:30px;height:30px}
.avatar.foto.buyuk{width:80px;height:80px;box-shadow:0 0 0 3px #fff,0 6px 18px rgba(59,52,44,.25)}
.portre-bas{display:flex;align-items:center;gap:16px;margin:4px 0 8px}
.portre-bas h2{margin:2px 0 2px}
.meme-alt{font-size:12.5px;font-style:italic;color:var(--mercan-k);font-weight:500;letter-spacing:.01em}
.ad-avatar{display:flex;align-items:center;gap:10px}
.kart h4{font-size:13.5px;font-weight:600;margin:5px 0 3px;line-height:1.3}
.kart p{font-size:12.5px;line-height:1.45;color:#5d5348;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kart .dugmeler{display:flex;gap:6px;margin-top:8px}
.kart .onay{background:var(--murekkep);color:#fff7ee;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px}
.kart .sonra{font-size:12px;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid rgba(59,52,44,.14)}
.kart.sonra-k{opacity:.6}
.kart.tikla{cursor:pointer}
.kart.tikla:hover{background:rgba(255,255,255,.9)}
.kart.onaylandi{opacity:.7}
.kart.onaylandi .dugmeler{display:none}
.kart .revize,.akis-pop .revize{font-size:12px;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid rgba(59,52,44,.14)}
.revize-alan{margin-top:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.revize-alan textarea{width:100%;box-sizing:border-box;min-height:70px;resize:vertical;font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid rgba(59,52,44,.2)}
.revize-alan .say{font-size:11px;color:var(--soluk)}
.revize-alan .hata{font-size:12px;color:#b3261e}
.revize-alan .dugmeler{flex-wrap:wrap}
.revize-alan button:disabled{opacity:.5}
.gecmis .revize-rozet{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:8px;background:rgba(59,52,44,.1)}
@media (max-width:768px){.kart .revize,.akis-pop .revize,.revize-alan button,.gecmis .revize-rozet+button{min-height:44px}.revize-alan textarea{font-size:16px}.kart .dugmeler{flex-wrap:wrap}}
.bos{font-size:12.5px;color:var(--soluk);padding:6px 2px}
.akis-kutu{flex:1 1 0}
.canli-rozet{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mercan-k)}
.akis{list-style:none;display:flex;flex-direction:column;gap:2px;overflow-x:hidden;overflow-y:auto;min-height:0}
.akis li.tikla{cursor:pointer;min-height:44px}
.akis li.tikla:hover{background:rgba(59,52,44,.04)}
.not.son-is.tikla{cursor:pointer}
.not.son-is.tikla:hover{background:rgba(59,52,44,.07)}
.gecmis ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.gecmis li{padding:8px 10px;border-radius:8px;background:rgba(59,52,44,.05);overflow-wrap:anywhere;min-width:0;flex-shrink:0}
.gecmis li.tikla{cursor:pointer;min-height:44px}
.gecmis li.tikla:hover{background:rgba(59,52,44,.09)}
.gecmis li.bos{color:#6d6357;font-size:13px}
.gecmis li p{margin:2px 0;font-size:13px}
.kurul-uyeler{display:flex;flex-direction:column;gap:8px}
.kurul-uye{display:flex;flex-direction:column;gap:3px;padding:9px 11px;border-radius:10px;background:rgba(59,52,44,.05);min-width:0;overflow-wrap:anywhere}
.kurul-uye b{font-size:14px;color:#3b342c}
.kurul-uye small{font-size:12px;line-height:1.4;color:#8a7f72}
.kurul-uye p{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:#3b342c}
.kurul-durum{align-self:flex-start;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;color:#fff;background:#ff7a59}
.kurul-durum.tamam{background:#5aa06e}.kurul-durum.cevapsiz{background:#a3978a}
.ykb-form{display:flex;flex-direction:column;gap:8px}
.ykb-hazir{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ykb-form textarea,.ykb-form select{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid rgba(59,52,44,.18);background:#fffaf3;color:#3b342c}
.ykb-once{display:flex;align-items:center;gap:8px;font-size:13px;color:#3b342c;cursor:pointer}
.ykb-form .koyu{align-self:flex-start}
.ykb-plan{display:flex;flex-direction:column;gap:8px;min-width:0;overflow-wrap:anywhere}
.ykb-plan small{color:#8a7f72;font-size:12px}
.ykb-yonergeler{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ykb-yonergeler label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:rgba(59,52,44,.05);cursor:pointer}
.ykb-yonergeler input{margin-top:3px;flex:none;width:18px;height:18px}
.ykb-yonergeler span{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12.5px;line-height:1.45;color:#3b342c}
.ykb-yonergeler b{font-size:13.5px}
@media (max-width:768px){.ykb-hazir button,.ykb-form .koyu,.ykb-plan .dugmeler button{min-height:44px}.ykb-form .koyu{align-self:stretch}.ykb-form textarea,.ykb-form select{font-size:16px;min-height:44px}.ykb-once{min-height:44px}.ykb-once input{width:24px;height:24px}.ykb-yonergeler label{min-height:44px}.ykb-yonergeler input{width:24px;height:24px}}
.gecmis small{color:#6d6357;font-size:12px}
.gecmis .chipler{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.gecmis .chipler button,.gecmis .daha{min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid rgba(59,52,44,.25);background:none;color:inherit;font-size:12.5px;cursor:pointer}
.gecmis .chipler button:disabled{opacity:.5;cursor:default}
.gecmis .daha{display:block;margin-top:6px;width:100%;border-radius:8px}
.gecmis .daha[hidden]{display:none}
.akis-pop{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,34,28,.45)}
.akis-pop[hidden]{display:none}
.akis-pop .kutu{background:#fffaf2;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:min(720px,100%);max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.akis-pop .ust{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(59,52,44,.12)}
.akis-pop .ust b{flex:1;min-width:0;font-size:13px;color:#6d6357;font-weight:600;overflow-wrap:anywhere}
.akis-pop .ust button{min-width:44px;min-height:44px;margin:-8px -6px -8px 0;border:0;background:none;font-size:22px;cursor:pointer;color:#6d6357}
.akis-pop .md{font-size:14px;line-height:1.55;overflow-wrap:anywhere;overflow-y:auto;padding:14px;margin:0;flex:1;min-height:0}
.akis-pop .md>:first-child{margin-top:0}
.akis-pop .md p,.akis-pop .md ul,.akis-pop .md ol,.akis-pop .md blockquote,.akis-pop .md pre,.akis-pop .md .tablo{margin:0 0 10px}
.akis-pop .md h3,.akis-pop .md h4,.akis-pop .md h5,.akis-pop .md h6{margin:14px 0 6px;line-height:1.3}
.akis-pop .md h3{font-size:17px}.akis-pop .md h4{font-size:15px}.akis-pop .md h5,.akis-pop .md h6{font-size:14px}
.akis-pop .md ul,.akis-pop .md ol{padding-left:22px}
.akis-pop .md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:rgba(59,52,44,.09);padding:1px 4px;border-radius:4px}
.akis-pop .md pre{white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(59,52,44,.09);padding:10px;border-radius:8px}
.akis-pop .md pre code{background:none;padding:0}
.akis-pop .md blockquote{padding:2px 12px;border-left:3px solid rgba(59,52,44,.3);color:#6d6357}
.akis-pop .md hr{border:0;border-top:1px solid rgba(59,52,44,.2);margin:12px 0}
.akis-pop .md a{color:#a85d1f}
.akis-pop .md .tablo{overflow-x:auto}
.akis-pop .md table{border-collapse:collapse;font-size:13px}
.akis-pop .md th,.akis-pop .md td{border:1px solid rgba(59,52,44,.2);padding:4px 8px;text-align:left}
.akis-pop .eylem{padding:10px 14px;border-top:1px solid rgba(59,52,44,.12);flex:none}
.akis-pop .eylem[hidden]{display:none}
.akis-pop .eylem .dugmeler{display:flex;gap:8px;flex-wrap:wrap}
.akis-pop .eylem button{min-height:44px;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid rgba(59,52,44,.25);background:none;color:inherit}
.akis-pop .eylem button.onay{background:var(--murekkep);color:#fff7ee;border-color:transparent}
.akis-pop .eylem textarea{display:block;width:100%;box-sizing:border-box;font-size:16px;margin-bottom:8px}
.akis li{display:flex;flex:none;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(59,52,44,.06);animation:kaygir .35s ease}
@keyframes kaygir{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.akis li{animation:none}}
.akis li .avatar{margin-top:1px;flex:none}
.akis li div{min-width:0;flex:1}
.akis li p{font-size:13px;line-height:1.38;white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.akis li small{display:block;font-size:11.5px;color:var(--soluk);margin-top:2px;white-space:normal;overflow-wrap:anywhere}
.akis li.ok p{color:var(--mercan-k);font-weight:600}
.akis li.hafiza p{color:#8a5a14;font-weight:600}
@keyframes gir{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* komut */
.komut{position:fixed;bottom:22px;left:calc((100% - var(--sag) - 16px) / 2);transform:translateX(-50%);width:min(600px,calc(100% - 460px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:20px;z-index:3}
.komut .ceo-ikon{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mercan-k);background:rgba(255,122,89,.12);padding:6px 8px;border-radius:8px}
.komut input,.komut textarea{flex:1;border:none;outline:none;background:transparent;font:inherit;font-size:15px;color:var(--murekkep);padding:10px 4px;min-width:0}
.komut textarea{resize:none;line-height:1.4;max-height:calc(1.4em * 8 + 20px);overflow-y:auto;field-sizing:content;display:block}
.komut input::placeholder,.komut textarea::placeholder{color:var(--soluk)}
.girdi-sayac{font-size:12px;color:var(--soluk);min-height:0}
.girdi-sayac:empty{display:none}
.girdi-sayac[data-durum="uyari"]{color:#8a5a00}
.girdi-sayac[data-durum="sinir"]{color:var(--mercan-k);font-weight:700}
.girdi-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.komut #komutSayac{position:absolute;right:16px;bottom:calc(100% + 4px)}
.komut #komutSayac:not([data-durum]){display:none}
.komut #komutSayac[data-durum=""]{display:none}
.yaz textarea,.gelistirme-form textarea{field-sizing:content}
.komut .ata{display:grid;place-items:center;color:#6d6357;flex:0 0 auto;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.12);font-size:15px;min-width:42px;min-height:40px}
.komut-ek{position:absolute;left:0;right:0;bottom:calc(100% + 6px);margin:0}
.komut-ek:empty{display:none}
.gonder{background:var(--mercan-k);color:#fff;font-weight:600;font-size:14px;padding:11px 18px;border-radius:14px;box-shadow:0 4px 14px rgba(255,122,89,.35);transition:transform .15s,background .15s}
.gonder:hover{background:var(--mercan-kk)}.gonder:active{transform:scale(.96)}
.gonder:disabled{opacity:.55;cursor:wait}

/* ajan paneli (sağ kolonun üstüne biner) */
.panel{position:fixed;top:76px;right:16px;bottom:42px;width:var(--sag);overflow:auto;padding:22px;transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:4;background:#fffaf3}
.panel.acik{transform:none}
.panel .kapat{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:10px;font-size:18px;color:var(--soluk)}
.panel .kapat:hover{background:rgba(255,255,255,.8)}
.panel .oda-etiket{font-size:12px;color:var(--soluk);font-weight:500}

const geoCache = new Map();

/* ---------- odalar ---------- */
const secilebilir = [];
function odaAltYazi(oda) {

  kutu(g, w, 1.9, .5, '#e9e1d4', x, 1.05, z, .05);

  kutu(g, .08, .72, .8, '#d8cdbd', x - w / 2 + .1, .44, z, .03);

/* LED rafları (veri + bakım) */
const ledDoku = tuvalDoku(64, 160);

}
ledCiz(0);

  const re = /`([^`]+)`|\*\*([^*]+)\*\*|__([^_]+)__|\*([^*\s][^*]*)\*|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
  let son = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > son) kok.append(s.slice(son, m.index));
    if (m[1] != null) kok.append(el('code', null, m[1]));
    else if (m[2] != null || m[3] != null) { const b = el('strong'); mdSatiriçi(b, m[2] ?? m[3]); kok.append(b); }
    else if (m[4] != null) { const i = el('em'); mdSatiriçi(i, m[4]); kok.append(i); }
    else { const a = el('a', null, m[5]); a.href = m[6]; a.target = '_blank'; a.rel = 'noopener noreferrer'; kok.append(a); }
    son = re.lastIndex;
  }
  if (son < s.length) kok.append(s.slice(son));
}
function mdCiz(kok, metin) {
  const satirlar = String(metin || '').replace(/\r\n?/g, '\n').split('\n');
  const cocuklar = [];
  let i = 0;
  const ozel = s => /^(#{1,6}\s|```|>\s?|[-*+]\s|\d+[.)]\s|(-{3,}|\*{3,}|_{3,})\s*$|\|)/.test(s);
  while (i < satirlar.length) {
    const s = satirlar[i];
    if (!s.trim()) { i++; continue; }
    let m;
    if (/^```/.test(s)) {
      const kod = []; i++;
      while (i < satirlar.length && !/^```/.test(satirlar[i])) kod.push(satirlar[i++]);
      i++;
      const pre = el('pre'); pre.append(el('code', null, kod.join('\n'))); cocuklar.push(pre);
    } else if ((m = /^(#{1,6})\s+(.*)$/.exec(s))) {
      const h = el('h' + Math.min(m[1].length + 2, 6)); mdSatiriçi(h, m[2].trim()); cocuklar.push(h); i++;
    } else if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(s)) {
      cocuklar.push(el('hr')); i++;
    } else if (/^>\s?/.test(s)) {
      const alinti = [];
      while (i < satirlar.length && /^>\s?/.test(satirlar[i])) alinti.push(satirlar[i++].replace(/^>\s?/, ''));
      const bq = el('blockquote'); mdSatiriçi(bq, alinti.join(' ')); cocuklar.push(bq);
    } else if (/^\s*([-*+]|\d+[.)])\s+/.test(s)) {
      const sirali = /^\s*\d/.test(s), liste = el(sirali ? 'ol' : 'ul');
      while (i < satirlar.length && (m = /^\s*(?:[-*+]|\d+[.)])\s+(.*)$/.exec(satirlar[i]))) {
        const li = el('li'); mdSatiriçi(li, m[1].replace(/^\[[ xX]\]\s+/, x => /[xX]/.test(x) ? '☑ ' : '☐ ')); liste.append(li); i++;
      }
      cocuklar.push(liste);
    } else if (/^\|/.test(s)) {
      const sat = [];
      while (i < satirlar.length && /^\|/.test(satirlar[i])) sat.push(satirlar[i++]);
      const tablo = el('table');
      sat.filter(x => !/^\|[\s:|-]+\|?\s*$/.test(x)).forEach((x, n) => {
        const tr = el('tr');
        x.replace(/^\|/, '').replace(/\|\s*$/, '').split('|').forEach(h => { const td = el(n === 0 ? 'th' : 'td'); mdSatiriçi(td, h.trim()); tr.append(td); });
        tablo.append(tr);
      });
      const kaydir = el('div', 'tablo'); kaydir.append(tablo); cocuklar.push(kaydir);
    } else {
      const par = [];
      while (i < satirlar.length && satirlar[i].trim() && (!par.length || !ozel(satirlar[i]))) par.push(satirlar[i++].trim());
      const p = el('p'); mdSatiriçi(p, par.join(' ')); cocuklar.push(p);
    }
  }
  kok.replaceChildren(...cocuklar);
}
let akisPop = null;
const akisPopKapat = () => { if (akisPop) akisPop.hidden = true; };
/* eylemKur(kap, kapat): isteğe bağlı alt şeride düğme ekler */
function akisPopAc(baslik, tam, url, eylemKur) {
  if (!akisPop) {
    const kapat = akisPopKapat;
    const kutu = el('div', 'kutu'), ust = el('div', 'ust'), x = el('button', null, '×');
    x.type = 'button'; x.setAttribute('aria-label', 'Kapat'); x.addEventListener('click', kapat);
    const eylemKap = el('div', 'eylem'); eylemKap.hidden = true;
    ust.append(el('b'), x); kutu.append(ust, el('div', 'md'), eylemKap);
    akisPop = el('div', 'akis-pop'); akisPop.hidden = true; akisPop.setAttribute('role', 'dialog'); akisPop.setAttribute('aria-modal', 'true');
    akisPop.append(kutu);
    akisPop.addEventListener('click', e => { if (e.target === akisPop) kapat(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !akisPop.hidden) kapat(); });
    document.body.append(akisPop);
  }
  akisPop.querySelector('b').textContent = baslik;
  const pre = akisPop.querySelector('.md'); mdCiz(pre, tam); pre.scrollTop = 0;
  const eylemKap = akisPop.querySelector('.eylem');
  eylemKap.replaceChildren(); eylemKap.hidden = !eylemKur;
  if (eylemKur) eylemKur(eylemKap, akisPopKapat);
  akisPop.hidden = false;
  akisPop.querySelector('button').focus();
  akisPop.dataset.url = url || '';
  if (url && !DEMO) getJSON(url).then(r => {
    if (akisPop.dataset.url !== url || !r || !r.metin) return;
    mdCiz(pre, r.metin + (r.kirpildi ? '\n\n…(kırpıldı)' : '')); pre.scrollTop = 0;
  }).catch(() => {});
}

const gecmisZaman = z => { const d = new Date(z); return isNaN(d) ? '—' : d.toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); };
function ajanKosusuAc(ajanId, kosuId, geri) {

function ceoKaydiAc(ceoId) {
  getJSON('/api/ceo-kayit?kosu=' + encodeURIComponent(ceoId)).then(r => {
    const k = r.kayit;
    if (!k) { akisPopAc('CEO kaydı', 'Bu kayıt bulunamadı.'); return; }
    const m = ['### İstek', k.istek || '_istek kaydı yok_', '### Ekler'];
    if (!Array.isArray(k.ekler)) m.push('_kayıt yok_');
    else if (!k.ekler.length) m.push('_ek yok_');
    else k.ekler.forEach(e => m.push('- ' + e.ad + ' (' + (e.tur === 'gorsel' ? 'görsel' : 'metin') + ')' + (e.yol ? ' → `' + e.yol + '`' : '')));
    if (k.kurul && Array.isArray(k.kurul.gorusler)) {
      m.push('### Mentor kurulu', '**Soru:** ' + (k.kurul.soru || ''));
      k.kurul.gorusler.forEach(g => m.push('**' + (g.ad || g.uye) + '**\n\n' + (g.gorus || '_görüş alınamadı' + (g.hata ? ': ' + g.hata : '') + '_')));
    }
    m.push('### CEO cevabı', k.cevap || (k.hata ? 'Hata: ' + k.hata : '_cevap kaydı yok_'));
    m.push('### Atamalar');
    if (!(k.atamalar || []).length) m.push('_atama yok_' + (k.kuru ? ' (kuru koşu)' : ''));
    (k.atamalar || []).forEach(a => m.push('- **' + (ajanBul(a.ajan)?.ad || a.ajan) + '**' + (a.kosu_id ? ' · `' + a.kosu_id + '`' : '') + (a.prompt ? ': ' + a.prompt : '')));
    (k.reddedilen || []).forEach(a => m.push('- ~~' + (ajanBul(a.ajan)?.ad || a.ajan) + '~~ atanmadı: ' + (a.neden || '')));
    if (r.eksik) m.push('_Not: bu kayıt eski; yalnız olay günlüğündeki alanlar var._');
    akisPopAc('CEO · ' + gecmisZaman(k.zaman), m.join('\n\n'), '', (kap, kapat) => {
      const baglar = (k.atamalar || []).filter(a => a.kosu_id);
      if (!baglar.length) { kap.hidden = true; return; }

      baglar.forEach(a => { const b = el('button', null, (ajanBul(a.ajan)?.ad || a.ajan) + ' koşusu ↗'); b.type = 'button'; b.onclick = () => ajanKosusuAc(a.ajan, a.kosu_id, () => ceoKaydiAc(ceoId)); dm.append(b); });
      kap.append(dm);
    });
  }).catch(() => akisPopAc('CEO kaydı', 'Kayıt okunamadı.'));
}

/* CEO soruyor kartları (yerel durum) */
const ONAY_ANAHTAR = 'ajan-ofisi-onaylar';

const temizMetin = s => String(s || '').replace(/[#*`>_|]/g, ' ').replace(/\s+/g, ' ').trim();
function kartEkle(o) {

    if (k.revizeAcik) { dug.hidden = true; kart.append(revizeAlani(k, () => kartlariCiz())); }

    const popUrl = !DEMO ?'/api/son-is?ajan=' + encodeURIComponent(k.ajan) + '&kosu=' + encodeURIComponent(k.kosu_id) : '';
    const popAc = () => akisPopAc(popBaslik, k.ozet || '(özet yok)', popUrl, (kap, kapat) => {

/* Revize iste: not alanı. kapat() = gönderim sonrası; vazgec() verilmezse kartın revizeAcik bayrağı kapatılıp yeniden çizilir. */
function revizeAlani(k, bitti, vazgecildi) {
  const kap = el('div', 'revize-alan');
  const ta = el('textarea'); ta.maxLength = 1000; ta.rows = 3; ta.value = k.revizeNot || '';
  ta.placeholder = 'Ajan neyi düzeltsin? (zorunlu, en fazla 1000 karakter)'; ta.setAttribute('aria-label', 'Revize notu');
  const say = el('div', 'say'), hata = el('div', 'hata'); hata.hidden = true;
  const dug = el('div', 'dugmeler'), gonder = el('button', 'onay', 'Gönder'), vazgec = el('button', 'sonra', 'Vazgeç');
  gonder.type = 'button'; vazgec.type = 'button';
  const guncelle = () => { k.revizeNot = ta.value; say.textContent = ta.value.length + ' / 1000'; gonder.disabled = !ta.value.trim(); };
  ta.addEventListener('input', guncelle); guncelle();
  vazgec.onclick = () => { k.revizeAcik = false; kap.remove(); if (vazgecildi) vazgecildi(); else kartlariCiz(); };
  gonder.onclick = async () => {
    const nota = ta.value.trim(); if (!nota) return;
    gonder.disabled = true; hata.hidden = true;
    let s;
    try { s = DEMO ? { durum:202, veri:{} } : await postJSON('/api/revize', { ajan:k.ajan, kosu_id:k.kosu_id, not:nota }); }
    catch { s = { durum:0, veri:{} }; }
    if (s.durum !== 202) { hata.textContent = s.veri.hata || 'Gönderilemedi'; hata.hidden = false; gonder.disabled = false; return; }
    k.revize = true; k.onay = true; k.revizeAcik = false; k.revizeNot = ''; onaylar.add(k.kosu_id); onayKaydet();
    akisEkle(k.ajan, 'Revize istendi: ' + (ajanBul(k.ajan)?.ad || k.ajan), '', 'ok');
    kartlariCiz(); bitti();
  };
  dug.append(gonder, vazgec); kap.append(ta, say, hata, dug);
  if (k.revizeAcik) setTimeout(() => ta.focus(), 0);

}

/* ---------- insan dili: araç olayları ---------- */
function detayAyir(detay) {
  const s = String(detay || ''); const i = s.indexOf('=');
  return i < 0 ? { anahtar:'', deger:s } : { anahtar:s.slice(0, i), deger:s.slice(i + 1) };
}
const dosyaAdi = yol => String(yol).split('/').filter(Boolean).pop() || String(yol);
const kisa = (s, n = 34) => (s = String(s)).length > n ? s.slice(0, n - 1) + '…' : s;
function eylemYaz(arac, detay) {
  const { deger } = detayAyir(detay);
  const dosya = kisa(dosyaAdi(deger), 30);
  switch (arac) {
    case 'Read': return { simdi:'okuyor: ' + dosya, gecmis:dosya + ' dosyasını okudu' };
    case 'Write': return { simdi:'yazıyor: ' + dosya, gecmis:dosya + ' dosyasını yazdı' };
    case 'Edit': case 'MultiEdit': case 'NotebookEdit': return { simdi:'yazıyor: ' + dosya, gecmis:dosya + ' dosyasını düzenledi' };
    case 'Grep': case 'Glob': return { simdi:'arıyor: ' + kisa(deger, 30), gecmis:'“' + kisa(deger, 40) + '” aradı' };
    case 'Bash': return { simdi:'komut çalıştırıyor', gecmis:'komut çalıştırdı' };
    case 'WebSearch': case 'WebFetch': return { simdi:'araştırıyor', gecmis:'web’de araştırdı' };
    case 'Task': case 'Agent': return { simdi:'alt-ajana iş veriyor', gecmis:'alt-ajana iş verdi' + (deger ? ': ' + kisa(deger, 40) : '') };
    case 'TodoWrite': return { simdi:'plan yapıyor', gecmis:'iş planı yaptı' };
    case 'YeniGorev': return { simdi:'yeni görev aldı', gecmis:'yeni görev aldı' };
    default: return { simdi:(arac || 'araç') + ' kullanıyor', gecmis:(arac || 'araç') + ' kullandı' };
  }
}

  const ust = eski.group.parent, p = eski.group.position.clone(), r = eski.group.rotation.clone();
  ust?.remove(eski.group); eski.dispose?.();
  yeni.group.position.copy(p); yeni.group.rotation.copy(r); ust?.add(yeni.group);
  return yeni;
}
function kontrolOdasiAc() {
  kontrolOdasi?.dispose();
  kontrolOdasi = kontrolOdasiKur({ odalar:ODALAR, ajanlar:AJANLAR, anilar:ANILAR, tur:ajanDuyguTuru });
  scene.add(kontrolOdasi.grup);
}
function gorunumUygula(yeni) {
  if (yeni !== 'duygu') yeni = 'kedi';
  if (yeni === GORUNUM) return;
  GORUNUM = yeni;
  try { localStorage.setItem(GORUNUM_K, yeni); } catch { /* seçim yalnız bu oturumda kalır */ }
  meme.kapat();
  tumAjanlar().forEach(a => { if (a.kedi) a.kedi = karakterDegistir(a.kedi, ajanKarakteri(a)); });
  tumAjanlar().forEach(a => altAjanTemizle(a.id, true)); terminalSenkron();   // terminal yavruları yeni görünümle yeniden doğar
  KURUL.forEach(m => { m.kedi = karakterDegistir(m.kedi, mentorKarakteri(m.kaynak, m.sira)); });
  if (cayci) { cayci.kedi = karakterDegistir(cayci.kedi, cayciKarakteri()); cayci.kedi.setDurum('dusunuyor'); }
  if (yeni === 'duygu') kontrolOdasiAc(); else { kontrolOdasi?.dispose(); kontrolOdasi = null; }
  PORTRE = portreUret();
  document.querySelectorAll('.avatar[data-portre]').forEach(d => { const f = PORTRE.get(d.dataset.portre); if (f) d.style.backgroundImage = 'url(' + f + ')'; });
  gorunumDugmeCiz();
  panelYenile();
}
const gorunumDugme = $('gorunumDugme');
function gorunumDugmeCiz() {
  const duygu = GORUNUM === 'duygu';
  gorunumDugme.setAttribute('aria-pressed', String(duygu));
  gorunumDugme.title = duygu ? 'Görünüm: Duygular · kedilere dön' : 'Görünüm: Kediler · duygu karakterlerine geç';
}
gorunumDugme.addEventListener('click', () => { SES.tik(); gorunumUygula(GORUNUM === 'duygu' ? 'kedi' : 'duygu'); });
gorunumDugmeCiz();
if (GORUNUM === 'duygu') kontrolOdasiAc();
// düşük FPS'te duygu ışıması kapanır (3 sn ortalama), toparlanınca geri gelir
let fpsKare = 0, fpsBas = performance.now(), parilti = true;
function gorunumGuncelle(t) {
  if (GORUNUM !== 'duygu') return;
  kontrolOdasi?.update(t);
  fpsKare++;
  const simdi = performance.now(), gecen = simdi - fpsBas;
  if (gecen < 3000) return;
  const fps = fpsKare * 1000 / gecen; fpsKare = 0; fpsBas = simdi;
  if (gecen > 6000) return;   // sekme arka plandaydı ya da görünüm yeni açıldı: ölçüm sayılmaz
  if (parilti && fps < 28) parilti = false; else if (!parilti && fps > 45) parilti = true; else return;
  parlamaAyarla(parilti);
}

/* ---------- 2D / 3D: 2D aynı veri durumundan (AJANLAR, sayac, terminaller, altMasalar) çizer; 3D döngüsü durur ---------- */
function ofis2dVeri() {
  const harf = ad => (String(ad || '?').trim()[0] || '?').toLocaleUpperCase('tr-TR');
  const ajanKarti = a => {
    const durum = a.durum === 'bitti' && a.sonHata ? 'hata' : a.durum || 'uyku', b = a.bilgi || {};
    const isde = durum === 'calisiyor' || durum === 'dusunuyor' || durum === 'bekliyor';
    const alt = [isde ? a.is : (a.ornek ? b.etiket : a.sonOzet), isde && a.kosuId ? 'koşu ' + String(a.kosuId).slice(0, 8) : '',
      a.ornek && b.model ? modelAdi(b.model) : '', a.terminalSay ? a.terminalSay + ' terminal' : ''].filter(Boolean).join(' · ');
    return { anahtar:'a:' + a.id, ad:a.ad || a.id, harf:harf(a.ad || a.id), renk:ajanRenk(a.id), durum,
      durumYazi:durum === 'hata' ? 'Hata · ' + (a.sonSure ?? '?') + ' sn' : durumMetni(a), alt, ac:{ tur:'ajan', id:a.id } };
  };
  const kurulDurum = { dinliyor:['calisiyor', 'dinliyor…'], tamam:['bitti', 'görüş verdi'], cevapsiz:['hata', 'cevap veremedi'] };
  const veriAjan = ajanBul('veri'), veriIste = veriAjan && veriAjan.durum !== 'uyku';
  const odalar = ODALAR.map(o => {
    const kartlar = tumAjanlar().filter(a => a.oda === o.id && !a.gizli).map(ajanKarti);
    if (o.id === 'kurul') KURUL.forEach(m => { const [d, y] = kurulDurum[m.durum] || ['uyku', 'boşta'];
      kartlar.push({ anahtar:'k:' + m.id, ad:m.ad || m.id, harf:harf(m.ad || m.id), renk:o.duvar || '#e8dccb', durum:d, durumYazi:y, alt:kisa(m.ozet || m.uzmanlik || '', 80), ac:{ tur:'oda', id:o.id } }); });
    if (o.id === 'ykb' && YKB && apiYkb) { const d = YKB.durum === 'bos' ? 'uyku' : YKB.durum;
      kartlar.push({ anahtar:'ykb', ad:apiYkb.ad || 'Başkan', harf:harf(apiYkb.ad || 'B'), renk:o.duvar || '#e8dccb', durum:d, durumYazi:ykbDurumMetni(YKB.durum), alt:apiYkb.model ? modelAdi(apiYkb.model) : '', ac:{ tur:'oda', id:o.id } }); }
    const masalar = o.id === 'veri' ? altMasalar.map(m => m.ad + ' · ' + (veriIste ? 'çalışıyor' : 'boşta')) : [];
    return { id:o.id, ad:o.ad || o.id, renk:o.duvar || o.hali1 || '#b9ad9e', kartlar, masalar };
  });
  const termDurum = { calisiyor:'çalışıyor', bekliyor:'bekliyor' };
  const terminal = [...terminaller.values()].map(t => ({ anahtar:t.oturum_adi, durum:t.durum || '',
    ust:t.pencere_adi && t.pencere_adi !== 'claude.exe' ? t.pencere_adi : t.oturum_adi,
    alt:[ajanBul(terminalSahibi(t))?.ad || t.ajan || 'sahipsiz', termDurum[t.durum] || t.durum || 'açık',
      t.son_arac ? 'son araç: ' + terminalEylem(t) : '', modelAdi(t.model)].filter(Boolean).join(' · ') }));
  return {
    ozet:[[sayac.bugun_kosu ?? 0, 'bugünkü koşu'], [calisanlar().length, 'çalışan ajan'], ['$' + Number(sayac.toplam_maliyet_usd || 0).toFixed(2), 'ofis maliyeti'],
      [kisaSayi(tokenGenel()), 'bugünkü token'], [terminaller.size, 'terminal oturumu']],
    odalar, terminaller:terminal,
  };
}
function ofis2dAc(h) {
  SES.tik();
  if (h.tur === 'ajan') { const a = ajanBul(h.id); if (a) ajanPaneli(a); }
  else { const o = odaBul(h.id); if (o) odaPaneli(o); }
}
function ofis2dTik() {   // 2D'de sürekli çizim yok: saniyede bir süre yazıları ve açık panel tazelenir
  // 3D döngüsündeki süreli durum dönüşleri (kurul ve Başkan dinlenmeye döner) 2D'de de işlesin
  if (kurulBitis && Date.now() > kurulBitis) animGuvenli('kurul', kurulAnimasyon, saat.elapsedTime, 0);
  if (YKB?.bitis && Date.now() > YKB.bitis) ykbDurumAyarla('bos');
  ofis2d.ciz();
  if (panelAjan && ajanBul(panelAjan)?.durum !== 'uyku') panelYenile();
}
let durduT = null;   // 3D durduğunda saat (THREE.Clock) değeri; dönüşte t kaldığı yerden sürer
function boyutUygula(yeni, kaydet = true) {
  if (yeni !== '2d' && !renderer.bos) yeni = '3d'; else yeni = '2d';
  BOYUT = yeni;
  if (kaydet) { try { localStorage.setItem(BOYUT_K, yeni); } catch { /* seçim yalnız bu oturumda kalır */ } yavasOlcum = null; }
  document.body.classList.toggle('boyut-2d', yeni === '2d');
  boyutDugmeCiz();
  if (yeni === '2d') {
    if (kare) { cancelAnimationFrame(kare); kare = 0; }
    if (durduT === null) durduT = saat.elapsedTime;
    if (meme.aktif()) meme.kapat();
    if (!ofis2d) ofis2d = ofis2dKur($('ofis2d'), { veri:ofis2dVeri, ac:ofis2dAc });
    ofis2d.ciz();
    if (!ofis2dZaman) ofis2dZaman = setInterval(ofis2dTik, 1000);
    return;
  }
  clearInterval(ofis2dZaman); ofis2dZaman = 0; clearTimeout(ofis2dIstek); ofis2dIstek = 0;
  if (boyutBekliyor) { boyutBekliyor = false; renderer.setSize(innerWidth, innerHeight); gorusKaydir(); }
  if (durduT !== null) { saat.getDelta(); saat.elapsedTime = durduT; durduT = null; }   // aradaki süre dt'ye girmez
  if (!kare) dongu();
}
const boyutDugme = $('boyutDugme');
function boyutDugmeCiz() {
  const iki = BOYUT === '2d';
  boyutDugme.setAttribute('aria-pressed', String(iki));
  boyutDugme.disabled = !!renderer.bos;
  boyutDugme.setAttribute('aria-label', renderer.bos ? '2D görünüm (WebGL yok, 3D kullanılamıyor)' : '2D görünüm');
  boyutDugme.title = renderer.bos ? 'Bu tarayıcıda WebGL yok: 3D açılamıyor, ofis 2D görünümde' : iki ? 'Görünüm: 2D · 3D sahneye dön' : 'Görünüm: 3D · hafif 2D görünüme geç';
}
boyutDugme.addEventListener('click', () => { SES.tik(); boyutUygula(BOYUT === '2d' ? '3d' : '2d'); });

/* ---------- nöbetçi: kritik alarm bandı + takılı görev rozeti (her sekmede) ---------- */
let nobetci = { alarmlar:[], takilanlar:[] }, bildirilenAlarm = null, demoAlarmGordu = false;
const zamanOnce = dk => new Date(Date.now() - dk * 60000).toISOString();
function nobetciDemo() {
  const n = demoVeri?.nobetci || {};
  return { alarmlar:(n.alarmlar || []).map(a => ({ ...a, zaman:zamanOnce(a.dk_once || 0), okundu:demoAlarmGordu })),
    takilanlar:(n.takilanlar || []).map(t => ({ ...t, takili_since:zamanOnce(t.takili_dk || 0) })) };
}
function sureYazi(iso) {
  const dk = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  return isNaN(dk) ? '—' : dk < 60 ? dk + ' dk' : dk < 1440 ? Math.floor(dk / 60) + ' sa' : Math.floor(dk / 1440) + ' gün';
}
function nobetciUygula(v) {
  nobetci = { alarmlar:v.alarmlar || [], takilanlar:v.takilanlar || [] };
  const kritik = nobetci.alarmlar.filter(a => a.seviye === 'kritik' && !a.okundu);
  const bant = $('alarmBant');
  bant.hidden = !kritik.length;
  if (kritik.length) {
    const a = kritik[0];
    $('alarmMetin').textContent = '⚠ ' + (a.proje ? a.proje + ': ' : '') + a.mesaj + ' · ' + saatYazi(new Date(a.zaman)) + (kritik.length > 1 ? ' (+' + (kritik.length - 1) + ' daha)' : '');
  }
  const yeni = kritik.filter(a => bildirilenAlarm && !bildirilenAlarm.has(a.id));
  bildirilenAlarm = new Set([...(bildirilenAlarm || []), ...kritik.map(a => a.id)]);
  if (yeni.length) {
    SES.alarm();
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Ajan Ofisi · kritik alarm', { body:(yeni[0].proje ? yeni[0].proje + ': ' : '') + yeni[0].mesaj }); } catch {}
  }
  const r = $('takiliRozet'), n = nobetci.takilanlar.length;
  r.hidden = !n; r.textContent = 'Takılı görev: ' + n;
}
async function nobetciYukle() {
  try { nobetciUygula(DEMO ? nobetciDemo() : await getJSON('/api/nobetci')); } catch {}
}
$('alarmGordum').onclick = async () => {
  SES.tik();
  if (DEMO) { demoAlarmGordu = true; return nobetciUygula(nobetciDemo()); }
  const { durum, veri } = await postJSON('/api/gelistirme', { islem:'alarm-gordum' });
  if (durum === 200) nobetciUygula(veri); else tost(veri.hata || ('hata ' + durum));
};
$('takiliRozet').onclick = () => { SES.tik(); sekmeAc('gelistirme'); };
addEventListener('pointerdown', () => { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch {} }, { once:true });

/* ---------- başlangıç ---------- */
kartlariCiz();
if (DEMO) { modGoster('demo', 'Demo · arka uç kapalı'); demo.basla(); ustGuncelle(); nobetciYukle(); }
else if (!apiAjanlar.length) { modGoster('kopuk', 'Sunucu yok · ?demo=1 ile dene'); tost('Sunucuya ulaşılamadı. Bağlamadan denemek için adrese ?demo=1 ekle.'); }
else { ilkDurum(); nobetciYukle(); setInterval(nobetciYukle, 30000); await sayacYukle(); await tokenYukle(); await terminalleriYukle(); canliBaglan(); setInterval(sayacYukle, 30000); setInterval(terminalleriYukle, 8000); setInterval(tokenYukle, 60000); }
const hash = new URLSearchParams(location.hash.slice(1));
const hOda = odaBul(hash.get('oda') || ''), hAjan = ajanBul(hash.get('ajan') || '');
if (hAjan) { odayaGit(odaBul(hAjan.oda), true); ajanPaneli(hAjan); odaVurgu(hAjan.oda); }
else if (hOda) { odayaGit(hOda, true); odaPaneli(hOda); odaVurgu(hOda.id); }
if (hash.get('sekme')) sekmeAc(hash.get('sekme'));
const hMeme = ajanBul(hash.get('meme') || '');
if (hMeme && BOYUT === '3d') setTimeout(() => meme.oynat(hMeme, { tut:true, aninda:true }), 900);
if (hash.get('gorev') && DEMO) setTimeout(() => ceoyaSor(hash.get('gorev')), 600);
ustGuncelle();
controls.update();
if (!BOYUT_KAYITLI && BOYUT === '3d') yavasOlcum = { n:0, bas:performance.now() };
boyutUygula(BOYUT, false);   // 3D ise döngü başlar; 2D ise döngü hiç başlamaz
</script>
