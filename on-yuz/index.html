<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe7da">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="ikon-192.png">
<title>Ajan Ofisi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ff7a59%22/%3E%3Crect x=%229%22 y=%2211%22 width=%2214%22 height=%2210%22 rx=%223%22 fill=%22%23fff7f2%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --krem:#efe7da; --murekkep:#3b342c; --soluk:#8a7f72; --mercan:#ff7a59; --mercan-k:#e9603f;
  --cam:rgba(255,250,243,.72); --cam-kenar:rgba(255,255,255,.8); --sag:384px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--krem);color:var(--murekkep);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#sahne{position:fixed;inset:0;display:block}
.vinyet{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 42% 58%,transparent 58%,rgba(120,96,70,.14) 100%)}
.cam{background:var(--cam);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);border:1px solid var(--cam-kenar);box-shadow:0 10px 40px rgba(90,70,50,.12),0 1px 0 rgba(255,255,255,.6) inset;border-radius:18px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h3.kucuk{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--soluk)}

/* üst bar */
.ustbar{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:28px;padding:0 20px;background:rgba(250,245,237,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(59,52,44,.08);z-index:5}
.marka{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--mercan);display:grid;place-items:center;box-shadow:0 4px 14px rgba(255,122,89,.4)}
.logo i{width:13px;height:9px;border-radius:3px;background:#fff7f2;position:relative}
.logo i::before,.logo i::after{content:"";position:absolute;top:3px;width:3px;height:3px;border-radius:1px;background:var(--mercan)}
.logo i::before{left:3px}.logo i::after{right:3px}
.marka b{font-family:"Space Grotesk",sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em}
.marka small{font-size:11px;color:var(--soluk);font-weight:600;letter-spacing:.06em;margin-left:2px}
.sekmeler{display:flex;gap:4px;height:100%}
.sekmeler button{position:relative;padding:0 12px;font-size:14px;font-weight:500;color:#6d6357}
.sekmeler button:hover{color:var(--murekkep)}
.sekmeler button.secili{color:var(--murekkep);font-weight:600}
.sekmeler button.secili::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--murekkep)}
.ustbar .bosluk{flex:1}
.hap{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.08)}
.hap b{font-family:"Space Grotesk",sans-serif;font-weight:600}
.nokta{width:8px;height:8px;border-radius:50%;background:#b9ad9e;flex:none}
.nokta.canli{background:var(--mercan);box-shadow:0 0 0 4px rgba(255,122,89,.18);animation:atis 1.4s ease-in-out infinite}
@keyframes atis{50%{box-shadow:0 0 0 7px rgba(255,122,89,.06)}}
.saat{font-size:13px;color:var(--soluk);font-variant-numeric:tabular-nums}
.dugme{padding:7px 12px;font-size:13px;font-weight:500;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.08);transition:background .15s,transform .15s}
.dugme:hover{background:#fff}.dugme:active{transform:scale(.97)}

/* selamlama */
.selam{position:fixed;top:78px;left:22px;width:330px;padding:18px 20px;z-index:3}
.selam .tarih{font-size:12px;color:var(--soluk);font-weight:500}
.selam h1{font-family:"Space Grotesk",sans-serif;font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 8px}
.selam p{font-size:14px;line-height:1.5;color:#4d453c}
.selam p b{color:var(--murekkep)}
.selam .ozetdugme{margin-top:12px;background:var(--murekkep);color:#fff7ee;font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px}
.selam .ozetdugme:hover{background:#2a241e}

/* sağ kolon */
.sag{position:fixed;top:76px;right:16px;bottom:42px;width:var(--sag);display:flex;flex-direction:column;gap:12px;z-index:3}
.kutu{padding:16px 16px 12px;display:flex;flex-direction:column;min-height:0}
.kutu .bas{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.kutu .bas h2{font-family:"Space Grotesk",sans-serif;font-size:16px;font-weight:600}
.kutu .bas small{display:block;font-size:12px;color:var(--soluk);margin-top:1px}
.koyu{background:var(--murekkep);color:#fff7ee;font-size:12px;font-weight:600;padding:7px 11px;border-radius:9px;white-space:nowrap}
.koyu:hover{background:#2a241e}
.ceo-kutu{flex:0 1 auto;max-height:52%}
.kartlar{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.kart{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:10px 12px;animation:gir .35s ease}
.kart .ust{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--soluk);font-weight:500}
.avatar{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.avatar.foto{width:26px;height:26px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(59,52,44,.22)}
.avatar.foto.orta{width:30px;height:30px}
.avatar.foto.buyuk{width:80px;height:80px;box-shadow:0 0 0 3px #fff,0 6px 18px rgba(59,52,44,.25)}
.portre-bas{display:flex;align-items:center;gap:16px;margin:4px 0 8px}
.portre-bas h2{margin:2px 0 2px}
.meme-alt{font-size:12.5px;font-style:italic;color:var(--mercan-k);font-weight:500;letter-spacing:.01em}
.ad-avatar{display:flex;align-items:center;gap:10px}
.kart h4{font-size:13.5px;font-weight:600;margin:5px 0 3px;line-height:1.3}
.kart p{font-size:12.5px;line-height:1.45;color:#5d5348;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kart .dugmeler{display:flex;gap:6px;margin-top:8px}
.kart .onay{background:var(--murekkep);color:#fff7ee;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px}
.kart .sonra{font-size:12px;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid rgba(59,52,44,.14)}
.kart.sonra-k{opacity:.6}
.kart.tikla{cursor:pointer}
.kart.tikla:hover{background:rgba(255,255,255,.9)}
.kart.onaylandi{opacity:.7}
.kart.onaylandi .dugmeler{display:none}
.bos{font-size:12.5px;color:var(--soluk);padding:6px 2px}
.akis-kutu{flex:1 1 0}
.canli-rozet{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mercan-k)}
.akis{list-style:none;display:flex;flex-direction:column;gap:2px;overflow-x:hidden;overflow-y:auto;min-height:0}
.akis li.tikla{cursor:pointer;min-height:44px}
.akis li.tikla:hover{background:rgba(59,52,44,.04)}
.not.son-is.tikla{cursor:pointer}
.not.son-is.tikla:hover{background:rgba(59,52,44,.07)}
.gecmis ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.gecmis li{padding:8px 10px;border-radius:8px;background:rgba(59,52,44,.05);overflow-wrap:anywhere;min-width:0}
.gecmis li.tikla{cursor:pointer;min-height:44px}
.gecmis li.tikla:hover{background:rgba(59,52,44,.09)}
.gecmis li.bos{color:#6d6357;font-size:13px}
.gecmis li p{margin:2px 0;font-size:13px}
.kurul-uyeler{display:flex;flex-direction:column;gap:8px}
.kurul-uye{display:flex;flex-direction:column;gap:3px;padding:9px 11px;border-radius:10px;background:rgba(59,52,44,.05);min-width:0;overflow-wrap:anywhere}
.kurul-uye b{font-size:14px;color:#3b342c}
.kurul-uye small{font-size:12px;line-height:1.4;color:#8a7f72}
.kurul-uye p{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:#3b342c}
.kurul-durum{align-self:flex-start;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;color:#fff;background:#ff7a59}
.kurul-durum.tamam{background:#5aa06e}.kurul-durum.cevapsiz{background:#a3978a}
.gecmis small{color:#6d6357;font-size:12px}
.gecmis .chipler{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.gecmis .chipler button,.gecmis .daha{min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid rgba(59,52,44,.25);background:none;color:inherit;font-size:12.5px;cursor:pointer}
.gecmis .chipler button:disabled{opacity:.5;cursor:default}
.gecmis .daha{display:block;margin-top:6px;width:100%;border-radius:8px}
.akis-pop{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,34,28,.45)}
.akis-pop[hidden]{display:none}
.akis-pop .kutu{background:#fffaf2;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:min(720px,100%);max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.akis-pop .ust{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(59,52,44,.12)}
.akis-pop .ust b{flex:1;min-width:0;font-size:13px;color:#6d6357;font-weight:600;overflow-wrap:anywhere}
.akis-pop .ust button{min-width:44px;min-height:44px;margin:-8px -6px -8px 0;border:0;background:none;font-size:22px;cursor:pointer;color:#6d6357}
.akis-pop .md{font-size:14px;line-height:1.55;overflow-wrap:anywhere;overflow-y:auto;padding:14px;margin:0;flex:1;min-height:0}
.akis-pop .md>:first-child{margin-top:0}
.akis-pop .md p,.akis-pop .md ul,.akis-pop .md ol,.akis-pop .md blockquote,.akis-pop .md pre,.akis-pop .md .tablo{margin:0 0 10px}
.akis-pop .md h3,.akis-pop .md h4,.akis-pop .md h5,.akis-pop .md h6{margin:14px 0 6px;line-height:1.3}
.akis-pop .md h3{font-size:17px}.akis-pop .md h4{font-size:15px}.akis-pop .md h5,.akis-pop .md h6{font-size:14px}
.akis-pop .md ul,.akis-pop .md ol{padding-left:22px}
.akis-pop .md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:rgba(59,52,44,.09);padding:1px 4px;border-radius:4px}
.akis-pop .md pre{white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(59,52,44,.09);padding:10px;border-radius:8px}
.akis-pop .md pre code{background:none;padding:0}
.akis-pop .md blockquote{padding:2px 12px;border-left:3px solid rgba(59,52,44,.3);color:#6d6357}
.akis-pop .md hr{border:0;border-top:1px solid rgba(59,52,44,.2);margin:12px 0}
.akis-pop .md a{color:#a85d1f}
.akis-pop .md .tablo{overflow-x:auto}
.akis-pop .md table{border-collapse:collapse;font-size:13px}
.akis-pop .md th,.akis-pop .md td{border:1px solid rgba(59,52,44,.2);padding:4px 8px;text-align:left}
.akis-pop .eylem{padding:10px 14px;border-top:1px solid rgba(59,52,44,.12);flex:none}
.akis-pop .eylem[hidden]{display:none}
.akis-pop .eylem .dugmeler{display:flex;gap:8px;flex-wrap:wrap}
.akis-pop .eylem button{min-height:44px;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid rgba(59,52,44,.25);background:none;color:inherit}
.akis-pop .eylem button.onay{background:var(--murekkep);color:#fff7ee;border-color:transparent}
.akis-pop .eylem textarea{display:block;width:100%;box-sizing:border-box;font-size:16px;margin-bottom:8px}
.akis li{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(59,52,44,.06);animation:kaygir .35s ease}
@keyframes kaygir{from{transform:translateY(-6px)}to{transform:none}}
.akis li .avatar{margin-top:1px}
.akis li div{min-width:0}
.akis li p{font-size:13px;line-height:1.38}
.akis li small{display:block;font-size:11.5px;color:#a3978a;margin-top:2px}
.akis li.ok p{color:var(--mercan-k);font-weight:600}
.akis li.hafiza p{color:#8a5a14;font-weight:600}
@keyframes gir{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* komut */
.komut{position:fixed;bottom:22px;left:calc((100% - var(--sag) - 16px) / 2);transform:translateX(-50%);width:min(600px,calc(100% - 460px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:20px;z-index:3}
.komut .ceo-ikon{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mercan-k);background:rgba(255,122,89,.12);padding:6px 8px;border-radius:8px}
.komut input{flex:1;border:none;outline:none;background:transparent;font:inherit;font-size:15px;color:var(--murekkep);padding:10px 4px;min-width:0}
.komut input::placeholder{color:#a3978a}
.komut .ata{flex:0 0 auto;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.12);font-size:15px;min-width:42px;min-height:40px}
.komut-ek{position:absolute;left:0;right:0;bottom:calc(100% + 6px);margin:0}
.komut-ek:empty{display:none}
.gonder{background:var(--mercan);color:#fff;font-weight:600;font-size:14px;padding:11px 18px;border-radius:14px;box-shadow:0 4px 14px rgba(255,122,89,.35);transition:transform .15s,background .15s}
.gonder:hover{background:var(--mercan-k)}.gonder:active{transform:scale(.96)}
.gonder:disabled{opacity:.55;cursor:wait}

/* ajan paneli (sağ kolonun üstüne biner) */
.panel{position:fixed;top:76px;right:16px;bottom:42px;width:var(--sag);overflow:auto;padding:22px;transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:4;background:rgba(255,250,243,.94)}
.panel.acik{transform:none}
.panel .kapat{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:10px;font-size:18px;color:var(--soluk)}
.panel .kapat:hover{background:rgba(255,255,255,.8)}
.panel .oda-etiket{font-size:12px;color:var(--soluk);font-weight:500}
.panel h2{font-family:"Space Grotesk",sans-serif;font-size:24px;font-weight:600;letter-spacing:-.02em;margin:2px 0 10px}
.panel h3{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--soluk);margin:14px 0 8px}
.durum{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(59,52,44,.07);color:#6d6357;max-width:100%}
.durum.calisiyor{background:rgba(255,122,89,.14);color:var(--mercan-k)}
.durum .nokta{width:7px;height:7px;background:currentColor;box-shadow:none;animation:none}
.canli-liste{display:flex;flex-direction:column;gap:8px}
.canli-liste .oturum{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.08)}
.canli-liste .ust{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.canli-liste .ust .nokta,.canli-liste .alt .nokta{width:7px;height:7px;border-radius:50%;background:#c9bfb2;flex:none}
.canli-liste .calisiyor>.nokta{background:#5aa36a}
.canli-liste small{display:block;font-size:12px;color:var(--soluk);margin-top:2px;line-height:1.35}
.canli-liste .alt{display:flex;gap:8px;align-items:baseline;margin:8px 0 0 14px;font-size:12.5px}
.canli-liste .bos{font-size:12.5px;color:var(--soluk)}
.satirlar{margin:16px 0 4px;display:flex;flex-direction:column;gap:10px}
.satir{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:13px;line-height:1.4}
.satir span:first-child{color:var(--soluk)}
.not{font-size:12px;line-height:1.45;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);border-radius:12px;padding:10px 12px;color:#5d5348;margin-top:10px;white-space:pre-line}
.hazir{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hazir button{text-align:left;font-size:12.5px;font-weight:500;line-height:1.3;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);transition:background .15s,transform .15s,border-color .15s}
.hazir button:hover{background:#fff;border-color:rgba(255,122,89,.45)}
.hazir button:active{transform:scale(.97)}
.yaz{display:flex;gap:8px}
.yaz input{flex:1;min-width:0;border:1px solid rgba(59,52,44,.12);background:rgba(255,255,255,.75);border-radius:12px;padding:11px 12px;font:inherit;font-size:13px;outline:none;color:var(--murekkep)}
.yaz input:focus{border-color:rgba(255,122,89,.6)}
.yaz .gonder{padding:10px 14px;font-size:13px}
.yaz .ata{flex:0 0 auto;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.12);font-size:15px;min-width:42px}
.ekler{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ekler button{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.12);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.not.son-is{max-height:42vh;overflow-y:auto;overflow-wrap:anywhere;-webkit-overflow-scrolling:touch}
.ajan-liste{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ajan-liste button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);font-size:13.5px;font-weight:500;text-align:left}
.ajan-liste button:hover{background:#fff}
.ajan-liste small{color:var(--soluk);font-weight:400;font-size:12px;text-align:right}

.mini-sayilar{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin:4px 0 12px}
.mini-sayilar div{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:9px 11px}
.mini-sayilar b{display:block;font-family:"Space Grotesk",sans-serif;font-size:20px;font-weight:700}
.mini-sayilar span{font-size:11.5px;color:var(--soluk)}
.cipler{display:flex;flex-wrap:wrap;gap:6px}
.cip{font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(59,52,44,.1);color:#5d5348}
.yetenekler{display:flex;flex-direction:column;gap:6px}
.yetenek{text-align:left;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);transition:background .15s,border-color .15s}
.yetenek:hover{background:#fff;border-color:rgba(255,122,89,.45)}
.yetenek div{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:500}
.yetenek small{color:var(--soluk);font-weight:400;font-size:11.5px;white-space:nowrap}
.yetenek.aktif{border-color:rgba(255,122,89,.6);background:#fff}
.ycubuk{height:4px;border-radius:2px;background:rgba(59,52,44,.1);margin-top:8px;overflow:hidden;position:relative}
.ycubuk i{position:absolute;top:0;bottom:0;width:30%;background:var(--mercan);border-radius:2px;animation:kay 1.3s ease-in-out infinite}
@keyframes kay{from{left:-30%}to{left:100%}}
.etiket3d.alt{background:rgba(255,251,246,.72);border-style:dashed}
.etiket3d.alt .ad{font-size:11px;color:#8a7f72}

/* sekme sayfaları */

(function () {

  function uygula(sahne) {
    document.body.classList.toggle('sahne-modu', sahne);
    b.textContent = sahne ? 'Pano' : 'Sahne';
    b.setAttribute('aria-pressed', String(!sahne));
  }
  var ilk = false; try { ilk = localStorage.getItem(k) === '1'; } catch (e) {}

  b.addEventListener('click', function () {
    var sahne = !document.body.classList.contains('sahne-modu');

})();

function odaOlcu(oda, liste) {

  const k = n > 4 ? Math.ceil(n / 2) : n, esit = n > 4 && n - k === k;
  oda.w = Math.max(ODA_W, (k + (esit ? .5 : 0)) * MASA_ARA + 2 * YAN_PAY);

// yerleşim: CEO orta sırada ortada; diğer odalar üst sıra, CEO'nun iki yanı, alt sıra. Yan oda sayısı en geniş sırayı en dar tutacak biçimde seçilir.
function yerlesimKur(odalar) {
  const ceo = odalar.find(o => o.id === 'ceo'), digeri = odalar.filter(o => o !== ceo), N = digeri.length;
  const gen = l => l.reduce((t, o) => t + o.w, 0) + Math.max(0, l.length - 1) * .6;
  let en = null;
  for (let s = 0; s <= N; s += 2) {
    const t = Math.ceil((N - s) / 2), ust = digeri.slice(0, t), yan = digeri.slice(t, t + s), alt = digeri.slice(t + s);
    const genislik = Math.max(gen(ust), gen(alt), ceo.w + yan.reduce((t, o) => t + o.w + .8, 0));
    if (!en || genislik < en.genislik - .01) en = { genislik, ust, yan, alt };
  }
  const { ust, yan, alt } = en, sol = yan.slice(0, yan.length / 2), sag = yan.slice(yan.length / 2);
  const dOrta = Math.max(ceo.d, ...yan.map(o => o.d));
  Object.assign(ceo, { cx:0, cz:0 });
  let x = -ceo.w / 2; [...sol].reverse().forEach(o => { x -= .8 + o.w; Object.assign(o, { cx:x + o.w / 2, cz:0 }); });
  x = ceo.w / 2; sag.forEach(o => { Object.assign(o, { cx:x + .8 + o.w / 2, cz:0 }); x += .8 + o.w; });
  const sira = (l, yon) => { let x = -gen(l) / 2; l.forEach(o => { Object.assign(o, { cx:x + o.w / 2, cz:yon * (dOrta / 2 + KORIDOR + o.d / 2) }); x += o.w + .6; }); };
  sira(ust, -1); sira(alt, 1);
}

function yerHesapla(a, liste) {
  if (elleYer(a)) return { x:a.yer.x, lz:a.yer.lz, ayak:!!a.yer.ayak };
  const ayni = liste.filter(x => x.oda === a.oda && !elleYer(x)), oda = odaBul(a.oda);

  const m = sira ? n - k : k, j = sira ? i - k : i, kay = n > 4 && n - k === k ? MASA_ARA / 4 : 0;
  const x = (j - (m - 1) / 2) * MASA_ARA + (sira ? kay : -kay);

/* ---------- insan dili: araç olayları ---------- */
function detayAyir(detay) {
  const s = String(detay || ''); const i = s.indexOf('=');

}
const dosyaAdi = yol => String(yol).split('/').filter(Boolean).pop() || String(yol);
const kisa = (s, n = 34) => (s = String(s)).length > n ? s.slice(0, n - 1) + '…' : s;
function eylemYaz(arac, detay) {
  const { deger } = detayAyir(detay);
  const dosya = kisa(dosyaAdi(deger), 30);
  switch (arac) {
    case 'Read': return { simdi:'okuyor: ' + dosya, gecmis:dosya + ' dosyasını okudu' };
    case 'Write': return { simdi:'yazıyor: ' + dosya, gecmis:dosya + ' dosyasını yazdı' };
    case 'Edit': case 'MultiEdit': case 'NotebookEdit': return { simdi:'yazıyor: ' + dosya, gecmis:dosya + ' dosyasını düzenledi' };
    case 'Grep': case 'Glob': return { simdi:'arıyor: ' + kisa(deger, 30), gecmis:'“' + kisa(deger, 40) + '” aradı' };
    case 'Bash': return { simdi:'komut çalıştırıyor', gecmis:'komut çalıştırdı' };
    case 'WebSearch': case 'WebFetch': return { simdi:'araştırıyor', gecmis:'web’de araştırdı' };
    case 'Task': case 'Agent': return { simdi:'alt-ajana iş veriyor', gecmis:'alt-ajana iş verdi' + (deger ? ': ' + kisa(deger, 40) : '') };
    case 'TodoWrite': return { simdi:'plan yapıyor', gecmis:'iş planı yaptı' };
    case 'YeniGorev': return { simdi:'yeni görev aldı', gecmis:'yeni görev aldı' };
    default: return { simdi:(arac || 'araç') + ' kullanıyor', gecmis:(arac || 'araç') + ' kullandı' };
  }
}

/* ---------- iş zarfı ---------- */
const zarflar = [];
const zarfGeo = yuvarlak(.5, .1, .34, .03);
function zarfGonder(hedef, bitince = () => {}) {
  const ceo = ajanBul('ceo');
  if (!ceo || hedef.id === 'ceo') { bitince(); return; }
  const bas = new THREE.Vector3(ceo.grup.position.x, 2.4, ceo.grup.position.z + .4);
  const son = new THREE.Vector3(hedef.grup.position.x, 2.3, hedef.grup.position.z + .2);
  const orta = bas.clone().lerp(son, .5); orta.y = 7 + bas.distanceTo(son) * .12;
  const egri = new THREE.QuadraticBezierCurve3(bas, orta, son);
  const iz = new THREE.Line(new THREE.BufferGeometry().setFromPoints(egri.getPoints(80)), new THREE.LineBasicMaterial({ color:'#ff7a59', transparent:true, opacity:.85 }));
  iz.geometry.setDrawRange(0, 0); scene.add(iz);
  const z = new THREE.Mesh(zarfGeo, new THREE.MeshStandardMaterial({ color:'#fff3ea', emissive:'#ff7a59', emissiveIntensity:.55 }));
  z.castShadow = true; scene.add(z);
  z.add(new THREE.PointLight('#ff8a66', 6, 6, 2));
  zarflar.push({ egri, iz, z, t:0, sure:1.5, bitince, son:false, solma:0 });
}
function zarfGuncelle(dt) {
  for (let i = zarflar.length - 1; i >= 0; i--) {
    const e = zarflar[i];
    if (!e.son) {
      e.t = Math.min(1, e.t + dt / e.sure);
      const k = e.t < .5 ? 2 * e.t * e.t : 1 - Math.pow(-2 * e.t + 2, 2) / 2;
      e.z.position.copy(e.egri.getPoint(k)); e.z.rotation.y += dt * 3;
      e.iz.geometry.setDrawRange(0, Math.floor(k * 81));
      if (e.t >= 1) { e.son = true; e.bitince(); scene.remove(e.z); }
    } else {
      e.solma += dt;
      e.iz.material.opacity = Math.max(0, .85 - e.solma * 1.4);
      if (e.solma > .7) { scene.remove(e.iz); e.iz.geometry.dispose(); e.iz.material.dispose(); e.z.material.dispose(); zarflar.splice(i, 1); }
    }
  }
}

function altAjanTemizle(anaId, yalnizTerminal = false) {

function bloptanB64(blob) {

async function gorselB64(f) {
  let blob = f;
  if (f.size > 1900000) {
    const bmp = await createImageBitmap(f);
    const o = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * o); c.height = Math.round(bmp.height * o);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);

}

    const ust = dizinDosya.slice(0, dizinDosya.lastIndexOf('/') + 1).replace(/\/$/, '');
    let d;

      };

      // markdown araç çubuğu + canlı önizleme

      const sar = (on, son, ornek) => {

      };

       ['</>', 'Kod', () => sar('`', '`', 'kod')], ['•', 'Liste', () => satirOnek('- ')], ['1.', 'Sıralı liste', () => satirOnek('1. ')],
       ['❝', 'Alıntı', () => satirOnek('> ')], ['🔗', 'Bağlantı', () => sar('[', '](https://)', 'metin')]].forEach(([e, ip, f]) => {
        const b = el('button', 'mini', e); b.type = 'button'; b.title = ip; b.setAttribute('aria-label', ip); b.onclick = f; cubuk.append(b);
      });

      return [...bas, yolSatiri(ust), el('h4', null, d.ad), cubuk, alan, dugmeler];
    }
    const cikti = [...bas, yolSatiri(ust), el('h4', null, d.ad)];
    if (d.kirpildi) cikti.push(el('p', 'alt', 'Dosya büyük olduğu için baştan kırpıldı; web\'den düzenlenemez.'));
    else { const duz = el('button', 'mini', '✏️ Düzenle'); duz.onclick = () => { dizinDuzenle = true; sekmeAc('dizin'); }; cikti.push(duz); }
    cikti.push(dizinMdCiz(d.metin));
    return cikti;
  }
  let d;
  try { d = await getJSON('/api/dizin?yol=' + encodeURIComponent(dizinYol)); }
  catch { if (dizinYol) { dizinYol = ''; return dizinSayfasi(); } return [...bas, el('p', 'alt', 'Dizin alınamadı.')]; }
  const liste = el('div', 'dizin-liste');

  let araZaman = null, araNo = 0;
  const ara = async () => {

  };
  girdi.addEventListener('input', () => { clearTimeout(araZaman); araZaman = setTimeout(ara, 350); });

  return [...bas, el('p', 'alt', 'Beynin içinde gez, .md dosyalarını oku, istersen düzenle.'), aramaKutu, sonucKutu, yolSatiri(d.yol), liste];
}
document.querySelectorAll('#sekmeler button').forEach(b => { b.onclick = () => { SES.tik(); sekmeAc(b.dataset.sekme); }; b.onmouseenter = () => SES.uzerinde(); });

/* ---------- kamera ---------- */
let gecis = null;

}

  const k = Math.max(1, oda.w / 14.5, oda.d / 8.4);

}
function gecisGuncelle(dt) {

  const t = gecis.t, k = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  camera.position.lerpVectors(gecis.p0, gecis.p1, k);

  if (t >= 1) gecis = null;
}
$('genel').onclick = () => { SES.tik(); panelKapat(); sekmeAc('ofis'); kameraGit(GENEL.poz, GENEL.hedef); };
$('genel').onmouseenter = () => SES.uzerinde();

/* ---------- kedi meme'leri (tıklanınca) ---------- */
const meme = memeKur({ kameraGit, controls, iptal:a => odayaGit(odaBul(a.oda)) });

/* ---------- seçim / hover ---------- */
const ray = new THREE.Raycaster(), fare = new THREE.Vector2();
let ustteki = null, secOda = null, basNokta = null;
function odaVurgu(id) { secOda = id; ODALAR.forEach(o => { o.zemin3d.material.emissiveIntensity = o.id === secOda ? .12 : o.id === ustteki?.oda ? .06 : 0; }); }
function hedefBul(e) {
  fare.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(fare, camera);
  const hits = ray.intersectObjects(secilebilir, false);
  const aj = hits.find(h => h.object.userData.ajan);
  if (aj) { const a = ajanBul(aj.object.userData.ajan); return { ajan:a.id, oda:a.oda }; }
  return hits[0] ? { oda:hits[0].object.userData.oda } : null;
}
tuval.addEventListener('pointermove', e => {
  const h = hedefBul(e);

});

});
$('komut').addEventListener('submit', e => { e.preventDefault(); const i = $('komutGir'); ceoyaSor(i.value); i.value = ''; });

/* ---------- kalıcı ajan etiketleri (çakışmasız) ---------- */
const etiketKok = $('etiketler');
const etiketler = new Map();
function etiketAl(a) {
  if (!etiketler.has(a.id)) {
    const d = el('div', 'etiket3d'); const ad = el('div', 'ad', a.ad); const ne = el('div', 'ne'); const sap = el('div', 'sap'); const balon = el('div', 'balon');
    const rozet = el('span', 'rozet'); rozet.style.display = 'none'; ad.append(rozet);
    const tok = el('div', 'tok'); tok.style.display = 'none';
    balon.style.display = 'none'; d.append(ad, ne, tok, balon, sap); etiketKok.append(d);
    etiketler.set(a.id, { d, ne, tok, sap, balon, rozet, rozetMetin:'', metin:'', tokMetin:'', sinif:'', balonMetin:null, w:0, h:0 });

}
function etiketMetni(a) {

  if (a.durum === 'uyku') return ['uyku', uykuMetni(a)];
  if (a.durum === 'bitti') return ['bitti', '✓ bitti · ' + (a.sonSure ?? '?') + ' sn'];
  if (a.durum === 'bekliyor') return ['calisiyor', 'iş yolda…'];

}
const tmpV = new THREE.Vector3();
function etiketGuncelle() {
  const ogeler = [];

    const e = etiketAl(a);
    const [sinif, metin] = etiketMetni(a);
    const balonMetin = a.balon && Date.now() < a.balonBitis ? a.balon : null;
    let degisti = false;
    if (e.metin !== metin) { e.ne.textContent = metin; e.metin = metin; degisti = true; }
    const rozetMetin = !a.alt && a.terminal && a.terminalSay > 1 ? a.terminalSay + ' terminal' : '';
    if (e.rozet && e.rozetMetin !== rozetMetin) { e.rozet.textContent = rozetMetin; e.rozet.style.display = rozetMetin ? '' : 'none'; e.rozetMetin = rozetMetin; degisti = true; }
    const tokMetin = !a.alt && sinif !== 'uyku' && tokenAl(a.id).toplam ? kisaSayi(tokenAl(a.id).toplam) + ' token' : '';
    if (e.tok && e.tokMetin !== tokMetin) { e.tok.textContent = tokMetin; e.tok.style.display = tokMetin ? '' : 'none'; e.tokMetin = tokMetin; degisti = true; }

    if (e.balonMetin !== balonMetin) { e.balon.textContent = balonMetin || ''; e.balon.style.display = balonMetin ? 'block' : 'none'; e.balonMetin = balonMetin; degisti = true; }

  ogeler.forEach(o => {
    const { w, h } = o.e;
    const asagi = o.alt;
    const sol0 = o.x - w / 2, ust0 = asagi ? o.y + 4 : o.y - h - 6;
    const adim = (asagi ? 1 : -1) * (h + 4);
    let secim = null;
    for (const [dx, dy, c] of ADAYLAR) {
      const sol = sol0 + dx * w, ust = ust0 + dy * adim;
      if (!carpar(sol, ust, w, h)) { secim = [sol, ust, dx]; break; }
    }
    if (!secim) { let ust = ust0; for (let i = 0; i < 8 && carpar(sol0, ust, w, h); i++) ust += adim; secim = [sol0, ust, 0]; }
    const [sol, ust, dx] = secim;
    yerlesen.push({ sol, ust, w, h });
    o.e.d.style.transform = `translate(${sol.toFixed(1)}px,${ust.toFixed(1)}px)`;
    o.e.sap.style.height = (!asagi && dx === 0 ? Math.max(0, o.y - 6 - (ust + h)) : 0).toFixed(1) + 'px';
  });
}
// aday konumlar: [yatay kayma (genişlik oranı), dikey basamak, maliyet] maliyete göre sıralı
const ADAYLAR = [[0, 0], [0, 1], [.58, 0], [-.58, 0], [.58, 1], [-.58, 1], [0, 2], [1.08, 0], [-1.08, 0], [1.08, 1], [-1.08, 1], [0, 3]];
const odaAdlari = ODALAR.map(o => {
  const d = el('div', 'oda-ad', o.ad.toLocaleUpperCase('tr-TR'));
  d.append(el('small', null, odaAltYazi(o))); etiketKok.append(d);
  return { o, d, p:new THREE.Vector3(o.cx - o.w / 2 + .4, o.cam ? 2.7 : 3.05, o.cz - o.d / 2 + .1) };
});
function odaAdGuncelle() {
  odaAdlari.forEach(({ o, d, p }) => {
    const goster = o.id === ustteki?.oda && !ustteki?.ajan;
    d.style.display = goster ? 'block' : 'none';

    const x = (tmpV.x * .5 + .5) * innerWidth, y = (-tmpV.y * .5 + .5) * innerHeight;

/* ---------- döngü ---------- */
const saat = new THREE.Clock();
let ledZaman = 0, panelZaman = 0, hatZaman = 0;
function ajanAnimasyon(a, t, dt) {
  const uyku = a.durum === 'uyku' || a.durum === 'bekliyor';
  a.kedi.setDurum(uyku ? 'uyuyor' : a.durum === 'bitti' || a.durum === 'dusunuyor' ? a.durum : 'calisiyor');
  a.kedi.update(dt);
  a.lamba.material.color.set(uyku ? '#b9ad9e' : '#ff7a59');
  a.zler.forEach((s, i) => {
    if (a.durum !== 'uyku' || a.memeAktif || a.kedi.aktif) { s.visible = false; return; }
    s.visible = true;
    const p = ((t * .45 + a.faz + i / 3) % 1);
    s.position.set(-.5 + p * .35, 1.3 + p * 1.0, .9);
    s.material.opacity = Math.sin(p * Math.PI) * .85;

}
function cekirdekGuncelle(t, dt) {
  cekirdek.parla = Math.max(0, cekirdek.parla - dt * .9);
  const nabiz = cekirdek.dusun ? (Math.sin(t * 6) * .5 + .5) * .6 : 0;
  const p = cekirdek.parla + nabiz;
  cekirdek.kristal.rotation.y += dt * (.25 + p * 1.5);
  cekirdek.kristal.position.y = Math.sin(t * 1.2) * .06;
  cekirdek.kristalMat.emissiveIntensity = .35 + p * 1.4;
  cekirdek.isilti.scale.setScalar(3.2 + p * 2.6);
  cekirdek.isilti.material.opacity = .75 + Math.min(.25, p);

}
function dongu() {

  gecisGuncelle(dt);
  AJANLAR.forEach(a => ajanAnimasyon(a, t, dt));
  zarfGuncelle(dt); akisGuncelle(dt); cekirdekGuncelle(t, dt); altAjanAnimasyon(t, dt);
  if (t - ledZaman > .16) { ledZaman = t; ledCiz(t); }
  if (t - hatZaman > 1.7) {
    // çalışan odaya giden hatta ışık akmaya devam eder
    hatZaman = t;
    new Set(AJANLAR.filter(a => a.durum === 'calisiyor').map(a => a.oda)).forEach(id => isikAkit(id));
    if (KURUL.some(m => m.durum === 'dinliyor')) isikAkit('kurul', false, '#d6ad52');
  }
  kurulAnimasyon(t, dt); cayciAnimasyon(t, dt);
  altMasalar.forEach(m => { if (t - m.zaman > .5) { m.zaman = t; altMasaCiz(m); m.ekran.t.needsUpdate = true; } });
  if (t - panelZaman > .5) { panelZaman = t; if (panelAjan && ajanBul(panelAjan)?.durum !== 'uyku') panelYenile(); }
  controls.update();
  renderer.render(scene, camera);
  etiketGuncelle();
  odaAdGuncelle();
  requestAnimationFrame(dongu);
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); gorusKaydir(); });

kartlariCiz();
if (DEMO) { modGoster('demo', 'Demo · arka uç kapalı'); demo.basla(); ustGuncelle(); }
else if (!apiAjanlar.length) { modGoster('kopuk', 'Sunucu yok · ?demo=1 ile dene'); tost('Sunucuya ulaşılamadı. Bağlamadan denemek için adrese ?demo=1 ekle.'); }
else { ilkDurum(); await sayacYukle(); await tokenYukle(); await terminalleriYukle(); canliBaglan(); setInterval(sayacYukle, 30000); setInterval(terminalleriYukle, 8000); setInterval(tokenYukle, 60000); }

const hOda = odaBul(hash.get('oda') || ''), hAjan = ajanBul(hash.get('ajan') || '');
if (hAjan) { odayaGit(odaBul(hAjan.oda), true); ajanPaneli(hAjan); odaVurgu(hAjan.oda); }
else if (hOda) { odayaGit(hOda, true); odaPaneli(hOda); odaVurgu(hOda.id); }
if (hash.get('sekme')) sekmeAc(hash.get('sekme'));

if (hMeme) setTimeout(() => meme.oynat(hMeme, { tut:true, aninda:true }), 900);
