<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe7da">
<title>Model kullanımı · Ajan Ofisi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ff7a59%22/%3E%3Crect x=%229%22 y=%2211%22 width=%2214%22 height=%2210%22 rx=%223%22 fill=%22%23fff7f2%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--krem:#efe7da;--murekkep:#3b342c;--soluk:#6f665a;--mercan-k:#c2482a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--krem);color:var(--murekkep);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--mercan-k);outline-offset:2px}
main{max-width:1080px;margin:0 auto;padding:28px 24px 48px}
.ust-serit{display:flex;justify-content:space-between;align-items:center;max-width:1080px;margin:0 auto;padding:16px 24px 0;font-size:13px;color:var(--soluk)}
.ust-serit a{color:var(--murekkep);font-weight:600;text-decoration:none}
.kagit{background:#fffaf3;border-radius:18px;padding:26px 28px;box-shadow:0 10px 40px rgba(90,70,50,.10)}
h2{font-family:"Space Grotesk",sans-serif;font-size:28px;font-weight:700;letter-spacing:-.02em}
.alt{font-size:13px;color:var(--soluk);margin:4px 0 18px;line-height:1.45}
h3.kucuk{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--soluk)}
.ozet-sayilar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ozet-sayilar div{background:rgba(255,255,255,.72);border-radius:12px;padding:12px 16px;min-width:150px}
.ozet-sayilar b{display:block;font-family:"Space Grotesk",sans-serif;font-size:26px;font-weight:700}
.ozet-sayilar span{font-size:12px;color:var(--soluk)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soluk);font-weight:600;padding:8px 10px;border-bottom:1px solid rgba(59,52,44,.12)}
td{padding:10px;border-bottom:1px solid rgba(59,52,44,.06);font-variant-numeric:tabular-nums}
td.sayi,th.sayi{text-align:right}
.maliyet-kap{overflow-x:auto}
@media (max-width:768px){
  main{padding:12px 16px 32px}.ust-serit{padding:12px 16px 0}.kagit{padding:18px 16px}
  .ozet-sayilar{gap:8px}.ozet-sayilar div{flex:1 1 calc(50% - 4px);min-width:0;padding:10px 12px}.ozet-sayilar b{font-size:22px}
  th,td{padding:8px 6px}
}
</style>
<link rel="stylesheet" href="modeller.css">
</head>
<body>
<div class="ust-serit"><a href="/#sekme=modeller">← Ajan Ofisi</a><span id="yenileme">her 5 dakikada yenilenir</span></div>
<main><div class="kagit" id="kok" aria-live="polite"><p class="alt">Yükleniyor…</p></div></main>
<script src="modeller.js"></script>
<script>
(function () {
  const kok = document.getElementById('kok');
  async function yukle() {
    try { kok.replaceChildren(...await window.ModelKullanim.sayfa({ tamSayfaDugmesi:false })); }
    catch (e) { const p = document.createElement('p'); p.className = 'alt'; p.textContent = 'Veri alınamadı: ' + e.message; kok.replaceChildren(p); }
  }
  yukle();
  setInterval(() => { if (!document.hidden) yukle(); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
